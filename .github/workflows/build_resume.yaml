name: Building New Resume
on:
  push:
    branches:
      - master
    paths:
      - "resume.json"
      - ".github/workflows/build_resume.yaml"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          npm ci
          pip install pypdf

      - name: Build resume (HTML + one-page PDF)
        run: npm run build

      - name: Update resources
        uses: test-room-7/action-update-file@v1
        with:
          file-path: |
            resume.pdf
            index.html
          commit-msg: Update resources
          allow-removing: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
